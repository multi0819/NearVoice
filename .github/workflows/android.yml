name: Build NearVoice APK
on:
  push:
    branches: [main, master, 'feat/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :wear:testDebugUnitTest :app:lintDebug :wear:lintDebug :app:assembleDebug :wear:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk NearVoice-phone.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk NearVoice-watch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NearVoice-install-APK
          path: |
            NearVoice-phone.apk
            NearVoice-watch.apk
          if-no-files-found: error
      - name: Publish install APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: watch-v1.0.7
          name: NearVoice 워치 v1.0.7
          body: 워치 음성 읽기를 미디어 음량으로 변경했습니다. 일반 알림 음량과 구분해서 조절할 수 있습니다. 워치용 APK만 기존 앱 위에 설치하세요. 휴대폰 앱은 변경되지 않았습니다.
          files: |
            NearVoice-phone.apk
            NearVoice-watch.apk
            app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NearVoice-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            wear/build/reports/
