name: Build NearVoice APK
on:
  push:
    branches: [main, master, 'feat/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :wear:testDebugUnitTest :app:lintDebug :wear:lintDebug :app:assembleDebug :wear:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk NearVoice-phone.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk NearVoice-watch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NearVoice-install-APK
          path: |
            NearVoice-phone.apk
            NearVoice-watch.apk
          if-no-files-found: error
      - name: Publish install APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.15
          name: NearVoice v1.0.15
          body: 설정에 위치 감지 시간대를 추가했습니다. 여러 시작·종료 구간과 자정 넘김을 지원합니다. 예약 날짜와 감지 구간 밖에서는 GPS 수신을 중지합니다. 시간 예약과 워치 앱은 그대로 유지됩니다. 휴대폰 APK만 기존 앱 위에 설치하세요.
          files: |
            NearVoice-phone.apk
            NearVoice-watch.apk
            app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NearVoice-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            wear/build/reports/
