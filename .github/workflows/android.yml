name: Build NearVoice APK
on:
  push:
    branches: [main, master, 'feat/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :wear:testDebugUnitTest :app:lintDebug :wear:lintDebug :app:assembleDebug :wear:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk NearVoice-phone.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk NearVoice-watch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NearVoice-install-APK
          path: |
            NearVoice-phone.apk
            NearVoice-watch.apk
          if-no-files-found: error
      - name: Publish install APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: NearVoice v1.0.8 (테스트용)
          body: 구글 지도에서 찾기 및 공유 받기로 목적지 등록을 추가합니다. 휴대폰만 업데이트하세요. 워치는 v1.0.6 유지. 좌표가 없는 링크는 지도에서 직접 확인해야 합니다.
          files: |
            NearVoice-phone.apk
            NearVoice-watch.apk
            app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NearVoice-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            wear/build/reports/
