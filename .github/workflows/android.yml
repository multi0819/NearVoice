name: Build NearVoice APK
on:
  push:
    branches: [main, master, 'feat/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test, lint and build
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :wear:testDebugUnitTest :app:lintDebug :wear:lintDebug :app:assembleDebug :wear:assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk NearVoice-phone.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk NearVoice-watch.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NearVoice-install-APK
          path: |
            NearVoice-phone.apk
            NearVoice-watch.apk
          if-no-files-found: error
      - name: Publish install APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.17
          name: NearVoice v1.0.17
          body: 위치+시간 예약은 선택 날짜의 지정 시각 이후 목적지 반경과 감지 시간대가 모두 맞을 때만 각 시각별 한 번 실행합니다. 조기 위치 알림을 차단하고 재생 직전 조건을 재검사합니다. 기존 앱을 삭제하지 말고 휴대폰 APK를 위에 설치하세요. 앱 ID와 서명키를 유지해 기존 예약과 설정을 보존합니다.
          files: |
            NearVoice-phone.apk
            NearVoice-watch.apk
            app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NearVoice-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
            wear/build/reports/
